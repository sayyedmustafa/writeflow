name: WriteFlow
options:
  bundleIdPrefix: com.sayyedmustafa.writeflow
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  WriteFlow:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sayyedmustafa.writeflow
        PRODUCT_NAME: WriteFlow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "WriteFlow"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: WriteFlowKeyboard

  WriteFlowKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: KeyboardExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sayyedmustafa.writeflow.keyboard
        PRODUCT_NAME: WriteFlowKeyboard
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KeyboardExtension/Info.plist
