name: Build iOS IPA (Pure Native Swift Pipeline)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Install XcodeGen
        run: brew install xcodegen

      - name: ⚙️ Generate Native Xcode Project
        run: xcodegen generate

      - name: 🔨 Compile Xcode Archive (No Signing Required)
        run: |
          xcodebuild -project WriteFlow.xcodeproj \
            -scheme WriteFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WriteFlow.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 📦 Package App into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/WriteFlow.xcarchive/Products/Applications/WriteFlow.app build/Payload/
          cd build
          zip -r WriteFlow.ipa Payload

      - name: 🚀 Upload Installable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WriteFlow-iOS-IPA
          path: build/WriteFlow.ipa
          retention-days: 14
