name: Build iOS IPA (Zero-Mac Cloud Pipeline)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm install

      - name: ⚙️ Generate Native Xcode Project with Keyboard Plugin
        run: npx expo prebuild --platform ios --clean

      - name: 🔨 Compile Xcode Archive (No Signing Required)
        run: |
          xcodebuild -workspace ios/WriteFlow.xcworkspace \
            -scheme WriteFlow \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WriteFlow.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: 📦 Package App into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/WriteFlow.xcarchive/Products/Applications/WriteFlow.app build/Payload/
          cd build
          zip -r WriteFlow.ipa Payload

      - name: 🚀 Upload Installable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WriteFlow-iOS-IPA
          path: build/WriteFlow.ipa
          retention-days: 14
